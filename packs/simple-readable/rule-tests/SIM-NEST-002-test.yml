id: sim-nest-002-py-deep-nesting
valid:
  - |
    for o in orders:
        if not o.paid:
            continue
        for item in o.items:
            if item.qty > 0:
                ship(item)
invalid:
  - |
    for o in orders:
        if o.paid:
            for item in o.items:
                if item.qty > 0:
                    ship(item)
