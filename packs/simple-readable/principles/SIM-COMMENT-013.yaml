id: SIM-COMMENT-013
version: 0.1.0
title: コメントには「なぜ」を書き、古いコードをコメントで残さない
summary: コメントは理由を書く。何をするかはコードと名前で表し、コメントアウトしたコードは消す
level: advisory
styles: { simple_readable: 1.0, maintainable: 0.7 }
applies_when: { languages: [typescript, python], layers: [any] }
not_when: []
rationale: >
  コードを言い換えただけのコメントは、コードが変わると嘘になる。
  コードから読み取れない理由（制約・経緯・選ばなかった案）こそ、コメントにしか残せない。
checks:
  static: [sim-comment-013-ts-commented-out-code, sim-comment-013-py-commented-out-code]
  review: コードをそのまま言い換えたコメントがないか。分かりにくい判断（回避策・性能上の理由）に理由が書かれているか
  tests: なし
example:
  bad: "// ユーザーを取得する\nconst user = getUser(id)"
  good: "// 退会済みユーザーも返す（請求履歴の表示に必要なため）\nconst user = getUserIncludingDeleted(id)"
tensions: []
evidence: { tools: [ruff:ERA001], repos: [] }
confidence: null
validation: 未評価
