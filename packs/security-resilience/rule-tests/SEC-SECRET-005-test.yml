id: sec-secret-005-ts-named-literal
valid:
  - const apiKey = process.env.API_KEY;
  - const passwordLabel = "Enter password";
  - const passwordField = "password_input";
  - const password = "changeme-in-env";
  - 'const opts = { tokenLength: 32 };'
invalid:
  - const apiKey = "a8f5f167f44f4964e6c998dee827110c";
  - 'const config = { clientSecret: "s3cr3tValue123" };'
  - this.password = "hunter2hunter2";
---
id: sec-secret-005-ts-known-format
valid:
  - const k = "AKIA";
invalid:
  - const k = "AKIAABCDEFGHIJKLMNOP";
  - 'fetch(url, { headers: { Authorization: "Bearer ghp_abcdefghijklmnopqrstuvwxyz0123456789" } });'
---
id: sec-secret-005-py-named-literal
valid:
  - API_KEY = os.environ["API_KEY"]
  - password_label = "Enter password"
  - TOKEN_ENV = "SERVICE_TOKEN_VALUE"
invalid:
  - API_KEY = "a8f5f167f44f4964e6c998dee827110c"
  - conn = connect(password="hunter2hunter2")
  - 'cfg = {"client_secret": "s3cr3tValue123"}'
---
id: sec-secret-005-py-known-format
valid:
  - k = "AKIA"
invalid:
  - token = "xoxb-1234567890-abcdefghij"
