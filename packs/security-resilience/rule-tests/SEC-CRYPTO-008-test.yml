id: sec-crypto-008-ts-math-random-secret
valid:
  - const jitter = Math.random() * 100;
  - const token = crypto.randomBytes(32).toString("hex");
invalid:
  - const resetToken = Math.random().toString(36).slice(2);
  - function makeSessionId() { return Math.random().toString(16); }
---
id: sec-crypto-008-ts-weak-hash
valid:
  - crypto.createHash("sha256").update(data).digest("hex");
invalid:
  - crypto.createHash("md5").update(pw).digest("hex");
---
id: sec-crypto-008-ts-weak-cipher
valid:
  - crypto.createCipheriv("aes-256-gcm", key, iv);
invalid:
  - crypto.createCipher("aes192", pw);
  - crypto.createCipheriv("aes-128-ecb", key, null);
---
id: sec-crypto-008-ts-tls-off
valid:
  - 'new https.Agent({ rejectUnauthorized: true });'
invalid:
  - 'new https.Agent({ rejectUnauthorized: false });'
  - process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0";
---
id: sec-crypto-008-py-random-secret
valid:
  - jitter = random.uniform(0, 1)
  - token = secrets.token_urlsafe(32)
invalid:
  - reset_token = random.getrandbits(128)
  - |
    def make_otp():
        return random.randint(100000, 999999)
---
id: sec-crypto-008-py-weak-hash
valid:
  - hashlib.md5(data, usedforsecurity=False)
  - hashlib.sha256(data)
invalid:
  - hashlib.md5(password.encode()).hexdigest()
---
id: sec-crypto-008-py-tls-off
valid:
  - requests.get(url, timeout=5)
invalid:
  - requests.get(url, verify=False, timeout=5)
  - ctx = ssl._create_unverified_context()
  - ctx.verify_mode = ssl.CERT_NONE
