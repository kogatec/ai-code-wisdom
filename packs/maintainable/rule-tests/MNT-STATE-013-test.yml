id: mnt-state-013-py-mutable-default
valid:
  - |
    def add(item, items=None):
        items = items or []
        items.append(item)
        return items
  - |
    def greet(name="world"):
        return name
invalid:
  - |
    def add(item, items=[]):
        items.append(item)
        return items
  - |
    def merge(a, extra: dict = {}):
        return {**a, **extra}
  - |
    def tag(x, seen=set()):
        seen.add(x)
