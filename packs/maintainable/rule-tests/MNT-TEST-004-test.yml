id: mnt-test-004-py-skip-without-reason
valid:
  - |
    @pytest.mark.skip(reason="外部 API の仕様変更待ち #123")
    def test_sync():
        assert True
  - |
    @pytest.mark.skipif(sys.platform == "win32", reason="POSIX のみ")
    def test_sync():
        assert True
invalid:
  - |
    @pytest.mark.skip
    def test_sync():
        assert True
