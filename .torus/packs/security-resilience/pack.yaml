id: security-resilience
version: 0.1.2
name: セキュリティ・障害耐性重視型
description: 攻撃と障害の両方に対して、壊れにくく、壊れても被害が広がらないコードを書く
values: [入力の検証, 秘密情報の保護, 最小権限, 障害の封じ込め, データの整合性]
suited_for:
  - 個人情報・決済・認証を扱うサービス
  - 外部 API に多く依存するバックエンド
  - 本番運用中・運用予定のプロダクト
tradeoffs:
  - 入口での検証や失敗時の処理が増えるため、コード量は増える
  - "試作段階では過剰に感じることがある（phase: prototype では advisory の原則と info の検査を外す）"
languages: [typescript, python]

# 何を止め、何を知らせるか
enforcement:
  block: 原則が mandatory かつ ルールの severity が error のとき、直るまで先へ進ませない
  warn: それ以外の違反は AI に知らせるが、止めない
  allow_inline: '理由を書いたコメント（torus-allow <原則ID>: 理由）がある箇所は、例外として監査の一覧に載せる'

# L0（常駐ルール）に載せる順。summary を1行ずつ使う
principles:
  - SEC-IV-001
  - SEC-INJ-002
  - SEC-INJ-003
  - SEC-PATH-004
  - SEC-SECRET-005
  - SEC-LEAK-006
  - SEC-AUTHZ-007
  - SEC-CRYPTO-008
  - SEC-DESER-009
  - RES-ERR-010
  - RES-TIMEOUT-011
  - RES-RETRY-012
  - RES-ASYNC-013
  - RES-ISO-014
  - RES-DATA-015

requires:
  ast-grep: ">=0.45"
  eslint: optional   # RES-ASYNC-013 の型を使う検査だけで使う

verification:
  rule_tests: 静的ルール42本すべて、テストケース（検出すべき例・検出してはいけない例）を通過（ast-grep 0.45.3）
  effect: 未評価（評価の仕組みを作ってから測る）
  evidence: CWE など標準への参照のみ。リポジトリからの根拠は Phase 3 で付ける
