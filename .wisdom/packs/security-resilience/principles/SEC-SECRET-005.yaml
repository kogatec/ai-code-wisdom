id: SEC-SECRET-005
version: 0.1.0
title: 秘密情報をコードに書かない
summary: 鍵・パスワード・トークンは環境変数かシークレット管理から読む
level: mandatory
styles: { security_resilience: 1.0 }
applies_when:
  languages: [typescript, python]
  layers: [any]
not_when: []
rationale: >
  コードに書いた秘密情報は、リポジトリの履歴に残り続け、消しても取り戻せない。
  外から読み込めば、漏れたときに鍵を入れ替えるだけで済む。
checks:
  static: [sec-secret-005-ts-named-literal, sec-secret-005-ts-known-format, sec-secret-005-py-named-literal, sec-secret-005-py-known-format]
  review: 設定ファイル・テスト・サンプルコードにも、本物の秘密情報が入っていないか
  tests: 秘密情報の環境変数が無いとき、起動時に明確なエラーで止まることを確かめる
example:
  bad: "const apiKey = 'a8f5f167f44f...'"
  good: "const apiKey = requireEnv('API_KEY')"
tensions: []
evidence: { standards: [CWE-798], repos: [] }
confidence: null
validation: 未評価
