id: sec-secret-005-ts-named-literal
language: TypeScript
severity: error
message: 秘密情報らしき値をコードに直接書いています
note: 環境変数かシークレット管理サービスから読み込んでください。テスト用の値なら、テスト専用の設定ファイルに置いてください。
metadata: { principle: SEC-SECRET-005 }
utils:
  secret-name:
    regex: '(?i)(passw(or)?d|secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token|^token$)'
    not:
      regex: '(?i)(field|label|placeholder|name|path|url|header|param|column|pattern|regex|hint|message|length|env)$'
  secret-literal:
    kind: string
    regex: '^[''"][^\s''"]{8,}[''"]$'
    not:
      regex: '(?i)(changeme|change_me|example|dummy|placeholder|your[-_]|xxxx|<[^>]*>|\$\{|todo|replace)'
rule:
  any:
    - kind: variable_declarator
      all:
        - has: { field: name, matches: secret-name }
        - has: { field: value, matches: secret-literal }
    - kind: pair
      all:
        - has: { field: key, matches: secret-name }
        - has: { field: value, matches: secret-literal }
    - kind: assignment_expression
      all:
        - has: { field: left, regex: '(?i)(passw(or)?d|secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token)$' }
        - has: { field: right, matches: secret-literal }
---
id: sec-secret-005-ts-known-format
language: TypeScript
severity: error
message: 既知の形式のアクセスキー・秘密鍵がコードに含まれています
note: すぐに鍵を無効化（ローテーション）し、環境変数かシークレット管理サービスから読み込む形に直してください。
metadata: { principle: SEC-SECRET-005 }
rule:
  any:
    - kind: string
    - kind: template_string
  regex: '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk-(proj-|ant-)?[A-Za-z0-9_\-]{20,}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{50,}|xox[abpors]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_\-]{35}|sk_live_[0-9A-Za-z]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
---
id: sec-secret-005-py-named-literal
language: Python
severity: error
message: 秘密情報らしき値をコードに直接書いています
note: os.environ かシークレット管理サービスから読み込んでください。テスト用の値なら、テスト専用の設定ファイルに置いてください。
metadata: { principle: SEC-SECRET-005 }
utils:
  secret-name:
    regex: '(?i)(passw(or)?d|secret|api_?key|access_?key|private_?key|auth_?token|access_?token|refresh_?token|^[''"]?token[''"]?$)'
    not:
      regex: '(?i)(field|label|placeholder|name|path|url|header|param|column|pattern|regex|hint|message|length|env)[''"]?$'
  secret-literal:
    kind: string
    regex: '^[rbRB]?[''"][^\s''"]{8,}[''"]$'
    not:
      regex: '(?i)(changeme|change_me|example|dummy|placeholder|your[-_]|xxxx|<[^>]*>|todo|replace)'
rule:
  any:
    - kind: assignment
      all:
        - has: { field: left, matches: secret-name }
        - has: { field: right, matches: secret-literal }
    - kind: keyword_argument
      all:
        - has: { field: name, matches: secret-name }
        - has: { field: value, matches: secret-literal }
    - kind: pair
      all:
        - has: { field: key, matches: secret-name }
        - has: { field: value, matches: secret-literal }
